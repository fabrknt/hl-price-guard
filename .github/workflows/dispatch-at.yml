# Start measure-us-session at a set time without relying on GitHub's cron, which has started this
# repository's scheduled runs hours late. A manual dispatch starts at once; a job may run at most
# 6 hours, so this waits in hops of at most `hop` minutes, re-dispatching itself between hops, and
# dispatches the measurement when `at` arrives. Only measure-us-session can be the target.
#   gh workflow run dispatch-at.yml -f at=2026-10-19T13:00:00Z \
#     -f start=2026-10-19T13:25:00Z -f end=2026-10-19T16:45:00Z -f label=us-20261019-part1
name: dispatch-at

on:
  workflow_dispatch:
    inputs:
      at:
        description: "When to dispatch, UTC (e.g. 2026-10-19T13:00:00Z)"
        required: true
      start:
        description: "Measurement window start, UTC"
        required: true
      end:
        description: "Measurement window end, UTC"
        required: true
      label:
        description: "Artifact label (letters, digits, - and _)"
        required: true
      hop:
        description: "Longest wait per job, minutes (1-340)"
        default: "340"

permissions:
  contents: read
  actions: write

jobs:
  relay:
    runs-on: ubuntu-latest
    timeout-minutes: 355
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
      AT: ${{ inputs.at }}
      START: ${{ inputs.start }}
      END: ${{ inputs.end }}
      LABEL: ${{ inputs.label }}
      HOP: ${{ inputs.hop }}
    steps:
      - name: Wait, then dispatch
        run: |
          ts='^[0-9]{4}-[0-9]{2}-[0-9]{2}T[0-9]{2}:[0-9]{2}:[0-9]{2}Z$'
          [[ $AT =~ $ts && $START =~ $ts && $END =~ $ts ]] || { echo "times must look like 2026-10-19T13:00:00Z"; exit 1; }
          [[ $LABEL =~ ^[A-Za-z0-9_-]{1,40}$ ]] || { echo "label: letters, digits, - and _ only"; exit 1; }
          [[ $HOP =~ ^[0-9]{1,3}$ ]] && HOP=$(( 10#$HOP )) && (( HOP >= 1 && HOP <= 340 )) || { echo "hop: 1 to 340"; exit 1; }
          # retry a failed dispatch: one lost call would lose the measurement (duplicates are harmless,
          # measure-us-session runs one per label)
          dispatch() {
            for n in 1 2 3 4 5 6; do
              gh workflow run "$@" --ref "$GITHUB_REF_NAME" && return 0
              echo "dispatch failed (attempt $n): $*"; sleep $(( 20 * n ))
            done
            return 1
          }
          wait=$(( $(date -ud "$AT" +%s) - $(date +%s) ))
          if (( wait > HOP * 60 )); then
            sleep $(( HOP * 60 ))
            echo "not yet: dispatching the next hop"
            dispatch dispatch-at.yml -f at="$AT" -f start="$START" -f end="$END" -f label="$LABEL" -f hop="$HOP"
          else
            (( wait > 0 )) && sleep "$wait"
            echo "dispatching measure-us-session for $START to $END"
            dispatch measure-us-session.yml -f start="$START" -f end="$END" -f label="$LABEL"
          fi
