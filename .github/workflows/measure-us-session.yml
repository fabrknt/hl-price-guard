# Re-measure book depth (safe_caps) and normal gaps (normal_gaps) through a US trading session,
# on GitHub's runners rather than a local machine. A job may run at most 6 hours, so the session
# is split in two. GitHub's cron can start late or not at all (worst at the top of the hour); each
# part has three triggers off the hour, sleeps until its window opens and stops when it closes.
# A trigger that finds its part already done skips. Three triggers lower the odds of a missed part;
# they do not remove them.
#
# Mon 2026-10-19 (US daylight time): 09:25-16:05 ET = 13:25-20:05 UTC = 22:25-05:05 JST.
#   part 1: 13:25-16:45 UTC, triggered 12:55, 13:05, 13:15
#   part 2: 16:45-20:05 UTC, triggered 16:10, 16:20, 16:35
# The crons match Oct 19 of any year; the job skips any date but 2026-10-19.
# Manual runs (workflow_dispatch) take their own window. This repository's crons have started
# hours late, so each part is also dispatched on time by dispatch-at.yml with label
# us-20261019-part1/-part2; a dispatch with that label shares the part's concurrency group, so
# whichever starts first measures and the other waits, finds the window closed and skips.
name: measure-us-session

on:
  schedule:
    - cron: "55 12 19 10 *"
    - cron: "5 13 19 10 *"
    - cron: "15 13 19 10 *"
    - cron: "10 16 19 10 *"
    - cron: "20 16 19 10 *"
    - cron: "35 16 19 10 *"
  workflow_dispatch:
    inputs:
      start:
        description: "Window start, UTC (e.g. 2026-10-17T03:00:00Z)"
        required: true
      end:
        description: "Window end, UTC (at most 6 hours after start)"
        required: true
      label:
        description: "Artifact label (letters, digits, - and _)"
        default: test

permissions:
  contents: read

jobs:
  measure:
    runs-on: ubuntu-latest
    timeout-minutes: 350
    concurrency:
      # one run per label (scheduled parts map to their label); a later trigger waits, then finds its
      # window closed and skips. Test dispatches share a label and so run one at a time, on purpose:
      # two at once would double the RPC rate.
      group: measure-${{ github.event_name == 'workflow_dispatch' && inputs.label || ((github.event.schedule == '10 16 19 10 *' || github.event.schedule == '20 16 19 10 *' || github.event.schedule == '35 16 19 10 *') && 'us-20261019-part2' || 'us-20261019-part1') }}
      cancel-in-progress: false
      queue: max # keep every pending trigger; by default a newer one would cancel a pending dispatch
    steps:
      - uses: actions/checkout@v4
      - name: Pick the window
        id: w
        env:
          EVENT: ${{ github.event_name }}
          SCHEDULE: ${{ github.event.schedule }}
          IN_START: ${{ inputs.start }}
          IN_END: ${{ inputs.end }}
          IN_LABEL: ${{ inputs.label }}
        run: |
          if [ "$EVENT" = workflow_dispatch ]; then
            # inputs become step outputs, one per line: reject anything but the expected shapes
            ts='^[0-9]{4}-[0-9]{2}-[0-9]{2}T[0-9]{2}:[0-9]{2}:[0-9]{2}Z$'
            [[ $IN_START =~ $ts && $IN_END =~ $ts ]] || { echo "start/end must look like 2026-10-17T03:00:00Z"; exit 1; }
            [[ $IN_LABEL =~ ^[A-Za-z0-9_-]{1,40}$ ]] || { echo "label: letters, digits, - and _ only"; exit 1; }
            span=$(( $(date -ud "$IN_END" +%s) - $(date -ud "$IN_START" +%s) ))
            (( span > 0 && span <= 6 * 3600 )) || { echo "end must be after start, by at most 6 hours"; exit 1; }
            echo "start=$IN_START" >> "$GITHUB_OUTPUT"; echo "end=$IN_END" >> "$GITHUB_OUTPUT"
            echo "label=$IN_LABEL" >> "$GITHUB_OUTPUT"; exit 0
          fi
          if [ "$(date -u +%F)" != 2026-10-19 ]; then echo "skip=1" >> "$GITHUB_OUTPUT"; exit 0; fi
          case "$SCHEDULE" in
            "55 12 19 10 *"|"5 13 19 10 *"|"15 13 19 10 *")
              echo "start=2026-10-19T13:25:00Z" >> "$GITHUB_OUTPUT"; echo "end=2026-10-19T16:45:00Z" >> "$GITHUB_OUTPUT"
              echo "label=us-20261019-part1" >> "$GITHUB_OUTPUT" ;;
            *)
              echo "start=2026-10-19T16:45:00Z" >> "$GITHUB_OUTPUT"; echo "end=2026-10-19T20:05:00Z" >> "$GITHUB_OUTPUT"
              echo "label=us-20261019-part2" >> "$GITHUB_OUTPUT" ;;
          esac
      - name: Measure
        if: steps.w.outputs.skip != '1'
        env:
          START: ${{ steps.w.outputs.start }}
          END: ${{ steps.w.outputs.end }}
        run: measure/session.sh "$START" "$END" out
      - name: Keep the results
        if: always() && steps.w.outputs.skip != '1'
        uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.w.outputs.label }}-${{ github.run_id }}
          path: out/
          retention-days: 90
          if-no-files-found: warn
