# Record HL trades, best bid/offer and books (measure/round_trips_collect.py), then pick out
# single-wallet push-and-unwind round trips (measure/round_trips.py), to calibrate the 0.27 in
# docs/safe-limits.md beyond one incident.
#
# Every 6 hours, a run of 325 minutes. GitHub may delay or drop a scheduled run, so coverage has holes;
# each run lists what it covered (covered.json) and the analysis keeps only what lies inside it.
# The 500 MB artifact quota (shared with the other workflow) bounds what is kept: raw feeds (about
# 55 MB a day gzipped) for 4 days, about 220 MB; the round trips found (fills only for the strict
# cohort, typically well under 1 MB a run) for 30 days, about 120 runs. Download what matters sooner.
# Runs only while the repository is public: a private repository has 2000 Actions minutes a month.
name: collect-round-trips

on:
  schedule:
    - cron: "7 */6 * * *"
  workflow_dispatch:
    inputs:
      minutes:
        description: "Minutes to collect (at most 325)"
        default: "325"

permissions:
  contents: read

jobs:
  collect:
    if: ${{ !github.event.repository.private }}
    runs-on: ubuntu-latest
    timeout-minutes: 350
    concurrency:
      group: collect-round-trips
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Collect
        env:
          MINUTES: ${{ inputs.minutes || '325' }}
        run: |
          [[ $MINUTES =~ ^[0-9]{1,3}$ ]] && (( MINUTES >= 1 && MINUTES <= 325 )) || { echo "minutes: 1 to 325"; exit 1; }
          pip install --quiet websockets==13.1
          python3 -I measure/round_trips_collect.py "$MINUTES" out
      - name: Find round trips
        if: always()
        run: python3 -I measure/round_trips.py round-trips.jsonl out | tee round-trips.txt
      - name: Keep the round trips
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: round-trips-${{ github.run_id }}
          path: |
            round-trips.jsonl
            round-trips.txt
            out/covered.json
          retention-days: 30
          if-no-files-found: warn
      - name: Keep the raw feeds
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: feeds-${{ github.run_id }}
          path: out/
          retention-days: 4
          compression-level: 0
          if-no-files-found: warn
